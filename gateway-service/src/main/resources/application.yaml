server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: gateway-service
  # lee las variables del .env que está en la raíz del repo
  config:
    import: optional:file:../.env[.properties]
  cloud:
    gateway:
      server:
        webflux:
          # permite que la web admin (otro dominio) llame al gateway
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: auth-service
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/usuarios/**
            - id: catalogo-service
              uri: ${CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/api/servicios/**,/api/peluqueros/**
            - id: reservas-service
              uri: ${RESERVAS_URL:http://localhost:8083}
              predicates:
                - Path=/api/reservas/**,/api/bloqueos/**
            - id: inventario-service
              uri: ${INVENTARIO_URL:http://localhost:8084}
              predicates:
                - Path=/api/materiales/**,/api/consumos/**,/api/compras/**
            - id: finanzas-service
              uri: ${FINANZAS_URL:http://localhost:8085}
              predicates:
                - Path=/api/movimientos/**
            # solo la documentación de auth-service: /docs/auth/v3/api-docs -> /v3/api-docs
            - id: docs-auth
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/docs/auth/v3/api-docs/**
              filters:
                - RewritePath=/docs/auth/v3/api-docs(?<resto>.*), /v3/api-docs${resto}
            # solo la documentación de catalogo-service: /docs/catalogo/v3/api-docs -> /v3/api-docs
            - id: docs-catalogo
              uri: ${CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/docs/catalogo/v3/api-docs/**
              filters:
                - RewritePath=/docs/catalogo/v3/api-docs(?<resto>.*), /v3/api-docs${resto}
            # solo la documentación de reservas-service: /docs/reservas/v3/api-docs -> /v3/api-docs
            - id: docs-reservas
              uri: ${RESERVAS_URL:http://localhost:8083}
              predicates:
                - Path=/docs/reservas/v3/api-docs/**
              filters:
                - RewritePath=/docs/reservas/v3/api-docs(?<resto>.*), /v3/api-docs${resto}
            # solo la documentación de inventario-service: /docs/inventario/v3/api-docs -> /v3/api-docs
            - id: docs-inventario
              uri: ${INVENTARIO_URL:http://localhost:8084}
              predicates:
                - Path=/docs/inventario/v3/api-docs/**
              filters:
                - RewritePath=/docs/inventario/v3/api-docs(?<resto>.*), /v3/api-docs${resto}
            # solo la documentación de finanzas-service: /docs/finanzas/v3/api-docs -> /v3/api-docs
            - id: docs-finanzas
              uri: ${FINANZAS_URL:http://localhost:8085}
              predicates:
                - Path=/docs/finanzas/v3/api-docs/**
              filters:
                - RewritePath=/docs/finanzas/v3/api-docs(?<resto>.*), /v3/api-docs${resto}

# la misma clave que usa auth-service para firmar el token
jwt:
  secret: ${JWT_SECRET}

# Swagger en http://<IP>/swagger-ui.html con un selector por microservicio
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /docs/auth/v3/api-docs
      - name: catalogo-service
        url: /docs/catalogo/v3/api-docs
      - name: reservas-service
        url: /docs/reservas/v3/api-docs
      - name: inventario-service
        url: /docs/inventario/v3/api-docs
      - name: finanzas-service
        url: /docs/finanzas/v3/api-docs
