server:
  port: ${PORT:8084}
  address: 0.0.0.0

spring:
  application:
    name: inventario-service
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        default_schema: inventario
        format_sql: true

# otros microservicios (en Docker cambian por el nombre del contenedor)
servicios:
  finanzas-url: ${FINANZAS_URL:http://localhost:8085}
